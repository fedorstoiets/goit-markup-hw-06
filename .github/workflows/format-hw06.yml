name: Format HW6 LMS fixes
on:
  push:
    paths:
      - '.github/workflows/format-hw06.yml'
      - 'css/**'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format project
        run: npx --yes prettier@3.6.2 --write index.html css/*.css js/*.js README.md
      - name: Commit Prettier fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js README.md
          if ! git diff --cached --quiet; then
            git commit -m "style(hw06): format LMS corrections with Prettier"
            git pull --rebase origin main
            git push
          fi
